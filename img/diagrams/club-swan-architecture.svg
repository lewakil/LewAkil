  <title id="diagram-title">
    Club Swan logical architecture: prepaid card purchase to ERC-721 digital
    twin
  </title>
  <desc id="diagram-desc">
    A buyer creates a prepaid card purchase event. Within the application
    boundary, eligibility and mint authorization are checked, purchase-to-NFT
    correlation and idempotent mint controls govern a controlled mint request.
    Across the blockchain boundary, the OpenZeppelin ERC-721 contract mints an
    NFT and records token ownership on Ethereum. The contract references
    interoperable token metadata; IPFS is an evaluated storage pattern, not a
    claimed deployed dependency. A wallet or digital experience reads ownership
    and metadata. The drawing expresses logical responsibilities, not an exact
    deployment topology.
  </desc>
