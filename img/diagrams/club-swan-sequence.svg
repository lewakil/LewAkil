  <path class="lifeline" d="M985 164V626" />
  <path class="edge" d="M105 211H310" />
  <path class="edge" d="M310 267H535" />
  <path class="edge" d="M535 323H760" />
  <path class="edge" d="M760 435H985" />
  <path class="reference" d="M760 379H535" />
  <path class="reference" d="M985 491H105" />
  <text x="208" y="198" class="message-label" text-anchor="middle">
    1 Purchase + ID
  </text>
  <text x="422" y="254" class="message-label" text-anchor="middle">
    2 Validate + authorize
  </text>
  <text x="647" y="310" class="message-label" text-anchor="middle">
    3 Submit mint transaction
  </text>
  <text x="647" y="366" class="message-label" text-anchor="middle">
    4 Confirmed mint + token ID
  </text>
  <text x="872" y="422" class="message-label" text-anchor="middle">
    5 Ownership + token URI
  </text>
  <text x="545" y="478" class="message-label" text-anchor="middle">
    6 View the NFT digital twin
  </text>
  <rect
    x="210"
    y="519"
    width="648"
    height="106"
    rx="10"
    fill="#F8FAFC"
    stroke="#CBD5E1"
    stroke-width="1.5"
  />
  <text x="228" y="540" class="body">
    Retry / partial failure · same purchase correlation ID
  </text>
  <path class="edge" d="M310 576H535" />
  <text x="422" y="566" class="message-label" text-anchor="middle">
    Repeat request
  </text>
  <path class="reference" d="M535 616H310" />
  <text x="422" y="607" class="message-label" text-anchor="middle">
    Existing token result
  </text>
  <text x="699" y="581" class="node-title" text-anchor="middle">
    No second NFT
  </text>
  <text x="699" y="605" class="note" text-anchor="middle">
    Idempotent mint controls
  </text>
  <text x="24" y="650" class="note">
    Mint controls include eligibility, authorization and purchase ↔ NFT
    correlation.
  </text>
  <text x="1075" y="650" class="note" text-anchor="end">
    Responsibilities, not deployment units.
  </text>
</svg>
