  <title id="title">SonaSteps — proposed family-facing AI architecture</title>
  <desc id="desc">
    Proposed AI architecture, not a claim of shipped functionality. A family or
    caregiver uses the SonaSteps application, which owns learning, lessons,
    progress, resources, the AI companion, and family context. A permitted
    request enters the AI application layer through a request handler, context
    builder, and orchestration. Policy and guardrails govern orchestration.
    Retrieval grounds responses in approved curriculum, lessons, and resources.
    Permitted application tools call SonaSteps APIs for progress, content
    lookup, search, and navigation. The application owns database state: family
    profiles, progress, and content metadata. Database access uses application
    permissions. The external model provider receives grounded context and
    returns output to structured output validation; it never writes directly to
    the application database. Validated answers and recommendations return to
    the family experience, or refer or escalate when a question exceeds the
    intended product scope. Proposed observability covers request logs,
    retrieval diagnostics, latency and failures, model and tool activity, and
    evaluation data. Optional application integrations are external
    dependencies. All AI components, integrations, and controls shown here are
    proposed design work.
  </desc>
