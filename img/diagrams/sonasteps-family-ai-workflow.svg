  <text x="785" y="469" class="body">Reviewed sources only</text>
  <text x="785" y="493" class="body">No sources → fallback</text>

  <rect x="405" y="380" width="290" height="123" rx="12" class="node" />
  <circle cx="428" cy="404" r="13" fill="#EFF6FF" />
  <text x="428" y="410" class="step" text-anchor="middle">5</text>
  <text x="452" y="411" class="node-title">Assemble grounded</text>
  <text x="452" y="435" class="node-title">model context</text>
  <text x="423" y="469" class="body">Source content + minimal</text>
  <text x="423" y="493" class="body">permitted application facts</text>

  <rect x="43" y="380" width="290" height="123" rx="12" class="node" />
  <circle cx="66" cy="404" r="13" fill="#EFF6FF" />
