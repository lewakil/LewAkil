  <path d="M695 206H767" class="edge" />
  <path d="M912 262V380" class="edge" />
  <text x="928" y="320" class="label">ground in sources</text>
  <path d="M767 439H695" class="edge" />
  <path d="M405 439H333" class="edge" />
  <path d="M188 503V548H35V674H43" class="edge" />
  <text x="204" y="554" class="label">validate before display</text>
  <path d="M333 674H405" class="edge" />
  <path d="M695 674H767" class="edge" />

