  <rect x="25" y="334" width="1050" height="185" rx="18" class="lane" />
  <text x="44" y="362" class="lane-title">
    Approved-content retrieval + external model
  </text>
  <rect x="25" y="565" width="1050" height="186" rx="18" class="lane" />
  <text x="44" y="593" class="lane-title">
    Application validation + family experience
  </text>

