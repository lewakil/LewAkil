  <text x="90" y="668" class="node-title">guardrails</text>
  <text x="61" y="701" class="body">Schema · sources · scope</text>
  <text x="61" y="725" class="body">App rules gate the result</text>

  <rect x="405" y="613" width="290" height="122" rx="12" class="node" />
  <circle cx="428" cy="637" r="13" fill="#EFF6FF" />
  <text x="428" y="643" class="step" text-anchor="middle">8</text>
  <text x="452" y="644" class="node-title">Present answer +</text>
  <text x="452" y="668" class="node-title">relevant sources</text>
  <text x="423" y="701" class="body">Link to approved content</text>
  <text x="423" y="725" class="body">Explain limits or refer</text>

  <rect x="767" y="613" width="290" height="122" rx="12" class="node" />
  <circle cx="790" cy="637" r="13" fill="#EFF6FF" />
  <text x="790" y="643" class="step" text-anchor="middle">9</text>
  <text x="814" y="644" class="node-title">Optional permitted</text>
  <text x="814" y="668" class="node-title">application action</text>
  <text x="785" y="701" class="body">Open lesson · find resource</text>
  <text x="785" y="725" class="body">Show progress · navigate</text>

  <text x="28" y="785" class="note">
    Only approved, reviewed content is eligible. Missing evidence or
    out-of-scope requests use a safe fallback.
  </text>
  <text x="28" y="814" class="note">
    The application owns permissions, curriculum, progress, persistent state,
    and allowed actions.
  </text>
</svg>
