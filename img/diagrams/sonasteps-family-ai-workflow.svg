<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1100"
  height="840"
  viewBox="0 0 1100 840"
  role="img"
  aria-labelledby="workflow-title workflow-desc"
>
  <title id="workflow-title">SonaSteps · Proposed family AI workflow</title>
  <desc id="workflow-desc">
    Proposed design; AI and retrieval are not implemented in the current
    SonaSteps prototype. Read the first lane from left to right, the second from
    right to left, and the third from left to right. A family asks a question.
    The request layer understands intent. The application builds only permitted,
    minimal family and application context. Retrieval selects approved,
    professionally reviewed SonaSteps content. The AI layer assembles grounded
    model context and asks an external model provider for a structured response.
    The application validates the schema, sources, scope, and guardrails, then
    presents an answer with relevant source content. Optional actions are
    limited to application-authorized lesson opening, resource finding, progress
    viewing, or navigation. Missing approved evidence or out-of-scope requests
    use a limitation or appropriate referral. The application remains the owner
    of permissions, curriculum, progress, persistent state, and allowed actions.
  </desc>
  <defs>
    <marker
      id="flow-arrow"
      viewBox="0 0 10 10"
      refX="9"
      refY="5"
      markerWidth="7"
      markerHeight="7"
      orient="auto"
    >
      <path
        d="M1 1L9 5L1 9"
        fill="none"
        stroke="#2563EB"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </marker>
    <style>
      text {
        font-family: Arial, Helvetica, sans-serif;
        fill: #0f172a;
      }
      .title {
        font-size: 25px;
        font-weight: 700;
        letter-spacing: -0.3px;
      }
      .subtitle {
        font-size: 19px;
        fill: #64748b;
      }
      .lane-title {
        font-size: 20px;
        font-weight: 700;
      }
      .lane {
        fill: #f8fafc;
        stroke: #cbd5e1;
        stroke-width: 1.4;
      }
      .node {
        fill: #ffffff;
        stroke: #cbd5e1;
        stroke-width: 1.5;
      }
      .node-title {
        font-size: 21px;
        font-weight: 600;
      }
      .body {
        font-size: 19px;
        fill: #64748b;
      }
      .step {
        font-size: 18px;
        font-weight: 700;
        fill: #2563eb;
      }
      .edge {
        fill: none;
        stroke: #2563eb;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        marker-end: url(#flow-arrow);
      }
      .label {
        font-size: 17px;
        fill: #64748b;
      }
      .note {
        font-size: 18px;
        fill: #475569;
      }
    </style>
  </defs>
  <rect width="1100" height="840" fill="#FFFFFF" />
  <text x="28" y="38" class="title">
    SonaSteps · Proposed family AI workflow
  </text>
  <text x="28" y="68" class="subtitle">
