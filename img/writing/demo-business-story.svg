<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="demo-title demo-desc">
  <title id="demo-title">A technical demo as a business story</title>
  <desc id="demo-desc">A quiet presentation stage is lit by a warm spotlight. Two speech bubbles frame a central screen: Tell, Show, Tell. A curved blue path on the screen moves from a fragmented starting point to a clear outcome. A script sits to one side and a concise result to the other, with a small audience in front. The illustration represents explaining the problem, demonstrating a purposeful workflow, and explaining what changed.</desc>
