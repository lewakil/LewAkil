<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="poc-title poc-desc">
  <title id="poc-title">A proof of concept as a focused experiment</title>
  <desc id="poc-desc">A hypothesis card feeds a single large laboratory flask. The flask contains a small controlled sample, and an observation sheet records evidence rather than a polished product interface. A branching decision beneath the sheet makes both proceeding and stopping valid outcomes. The illustration represents testing the riskiest assumption, collecting evidence, and using the result to decide whether to build.</desc>
