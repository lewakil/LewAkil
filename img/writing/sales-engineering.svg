  <title id="sales-title">Sales engineering as a translation bridge</title>
  <desc id="sales-desc">A suspension bridge connects a customer's discovery question with an understandable outcome. The bridge has visible supporting cables and a small interlocking mechanism beneath its deck, representing the technical system that makes the crossing possible. A blue signal crosses the bridge. Discovery, translation and value appear as the only labels. The illustration connects customer problems, engineering reality and business consequences.</desc>
