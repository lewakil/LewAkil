<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Technical storytelling: a clear path through a complex system</title>
  <desc id="desc">A dark navy engineering blueprint contains a network of components, boundaries, and relationships. A selected cyan path preserves the important connections and resolves into a readable sequence: trigger, decision, consequence. The illustration represents the article's idea that clarity compresses complexity without removing technical truth.</desc>
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#12243B"/><stop offset="1" stop-color="#08172A"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0 H0 V32" fill="none" stroke="#4B7399" stroke-width="0.6" opacity="0.18"/></pattern>
    <pattern id="major-grid" width="160" height="160" patternUnits="userSpaceOnUse"><path d="M160 0 H0 V160" fill="none" stroke="#5E81A4" stroke-width="0.8" opacity="0.2"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#82D9E8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#F1F5FA}.title{font-size:38px;font-weight:600}.step{font-size:30px;font-weight:600}.label{font-size:22px;fill:#A7BED5}.num{font-size:20px;fill:#A2E9F0;font-weight:600}.caption{font-size:22px;fill:#B8CCDF}
    </style>
  </defs>
  <rect width="960" height="640" fill="url(#navy)"/>
  <rect width="960" height="640" fill="url(#grid)"/>
  <rect width="960" height="640" fill="url(#major-grid)"/>
  <path d="M64 99 H895" stroke="#36516B"/>
  <text x="64" y="73" class="title">Clarity is compression.</text>

  <!-- Full structure remains visible behind the deliberately selected path. -->
  <rect x="60" y="138" width="406" height="363" rx="24" fill="#17304A" fill-opacity="0.24" stroke="#496785" stroke-width="1.3"/>
  <rect x="88" y="161" width="189" height="147" rx="16" fill="none" stroke="#365873"/>
  <rect x="299" y="187" width="141" height="209" rx="16" fill="none" stroke="#365873"/>
  <rect x="86" y="334" width="194" height="141" rx="16" fill="none" stroke="#365873"/>
  <g fill="none" stroke="#527591" stroke-width="1.5" opacity="0.68">
    <path d="M108 270 H150 V285 H230 V269 H306 M150 240 V211 H249 M208 173 V200 H261 V281 M108 370 H134 V455 H189 M111 428 H261 M163 357 V386 H223 V350 M246 435 H324 V386 M337 218 V257 H411 V303 M336 277 H360 V328 H423 M398 354 V378 H320 M466 218 H504 V276 H480 M466 381 H493 V422 H475"/>
    <circle cx="110" cy="270" r="6"/><circle cx="230" cy="269" r="6"/><circle cx="208" cy="174" r="6"/><circle cx="249" cy="211" r="6"/><circle cx="261" cy="281" r="6"/><circle cx="111" cy="370" r="6"/><circle cx="189" cy="455" r="6"/><circle cx="111" cy="428" r="6"/><circle cx="163" cy="357" r="6"/><circle cx="223" cy="350" r="6"/><circle cx="246" cy="435" r="6"/><circle cx="337" cy="218" r="6"/><circle cx="411" cy="303" r="6"/><circle cx="360" cy="328" r="6"/><circle cx="398" cy="354" r="6"/>
  </g>
  <g stroke="#527591" stroke-width="1.5" fill="#17304A">
    <rect x="125" y="248" width="53" height="34" rx="7"/>
    <rect x="231" y="228" width="38" height="40" rx="7"/>
    <rect x="368" y="231" width="49" height="38" rx="7"/>
    <rect x="112" y="383" width="43" height="28" rx="7"/>
    <rect x="238" y="386" width="32" height="32" rx="7"/>
    <path d="M323 429 V456 C323 471 403 471 403 456 V429 M323 442 C323 457 403 457 403 442"/>
    <ellipse cx="363" cy="429" rx="40" ry="11"/>
  </g>

  <!-- One relevant path, connected to its explanation. -->
  <path d="M109 196 H151 V224 H325 V349 H210 V431 H315 C454 431 449 322 580 322" fill="none" stroke="#82D9E8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <g fill="#16374F" stroke="#82D9E8" stroke-width="2">
    <circle cx="151" cy="224" r="15"/><circle cx="325" cy="349" r="15"/><circle cx="210" cy="431" r="15"/>
  </g>
  <g fill="#82D9E8"><circle cx="151" cy="224" r="4"/><circle cx="325" cy="349" r="4"/><circle cx="210" cy="431" r="4"/></g>
  <path d="M151 209 V190 M325 334 V315 M210 416 V397" stroke="#82D9E8" stroke-width="1.5"/>

  <!-- The readable sequence sits outside the blueprint, at another abstraction. -->
  <text x="608" y="164" class="label" letter-spacing="1">EXPLAIN THE PATH</text>
  <path d="M628 225 V441" stroke="#437690" stroke-width="2"/>
  <g fill="#123249" stroke="#82D9E8" stroke-width="1.5">
    <circle cx="628" cy="229" r="24"/><circle cx="628" cy="337" r="24"/><circle cx="628" cy="445" r="24"/>
  </g>
  <text x="628" y="236" class="num" text-anchor="middle">01</text>
  <text x="628" y="344" class="num" text-anchor="middle">02</text>
  <text x="628" y="452" class="num" text-anchor="middle">03</text>
  <text x="675" y="227" class="step">Trigger</text>
  <text x="675" y="258" class="label">What starts it?</text>
  <text x="675" y="335" class="step">Decision</text>
  <text x="675" y="366" class="label">Who owns it?</text>
  <text x="675" y="443" class="step">Consequence</text>
  <text x="675" y="474" class="label">What happens next?</text>
  <path d="M64 535 H895" stroke="#36516B"/>
  <text x="64" y="575" class="caption">Relationships. Boundaries. Tradeoffs.</text>
  <text x="895" y="575" class="caption" text-anchor="end" fill="#D6EEF4">Shared understanding.</text>
</svg>
